<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>安規工具</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1f4d5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="安規工具">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
  :root{
    --bg:#f4f1ea; --card:#fff; --ink:#211d17; --sub:#6f6656;
    --line:#e6e0d3; --accent:#1f4d5c;
    --shadow:0 1px 2px rgba(33,29,23,.06), 0 8px 24px -12px rgba(33,29,23,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17140f; --card:#211c15; --ink:#f1ece0; --sub:#b3a891;
      --line:#3a3225; --accent:#8fc2cf;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17140f; --card:#211c15; --ink:#f1ece0; --sub:#b3a891;
    --line:#3a3225; --accent:#8fc2cf;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:720px; margin:0 auto; padding:32px 16px 56px}
  .eyebrow{font-size:12px; letter-spacing:.12em; font-weight:700; color:var(--accent); text-transform:uppercase}
  h1{margin:6px 0 4px; font-size:clamp(22px,5vw,28px); font-weight:900; letter-spacing:-.01em}
  .lede{margin:0 0 24px; font-size:13.5px; color:var(--sub); line-height:1.7}
  .tools{display:grid; gap:12px}
  a.tool{
    display:block; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  a.tool::before{content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--accent)}
  a.tool[aria-disabled="true"]{opacity:.5; pointer-events:none}
  a.tool[aria-disabled="true"]::before{background:var(--line)}
  .tool h2{margin:0 0 4px; font-size:15.5px; font-weight:700}
  .tool p{margin:0; font-size:12.5px; color:var(--sub); line-height:1.6}
  .tag{
    display:inline-block; margin-left:8px; padding:2px 8px; border-radius:999px;
    font-size:11px; font-weight:700; background:var(--line); color:var(--sub); vertical-align:2px;
  }
  footer{margin-top:28px; font-size:12px; color:var(--sub); line-height:1.8}
  code{font-size:11.5px; word-break:break-all}

  /* ── 同步 ── */
  .sync{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; box-shadow:var(--shadow); margin-top:20px}
  .sync-h{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .sync-h h2{margin:0; font-size:15.5px; font-weight:700; flex:1}
  .dot{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
    padding:3px 10px; border-radius:999px; background:var(--line); color:var(--sub)}
  .dot::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
  .dot.ok{background:#d7ece4; color:#0d5c4a}
  .dot.busy{background:#fdf0d2; color:#7a5500}
  .dot.err{background:#f6dcd9; color:#8a2c26}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dot.ok{background:#15332a;color:#6fdcbe}
    :root:not([data-theme="light"]) .dot.busy{background:#3a2c16;color:#e0b063}
    :root:not([data-theme="light"]) .dot.err{background:#3b211f;color:#f0a19a}}
  .sync p{margin:10px 0 0; font-size:12.5px; color:var(--sub); line-height:1.7}
  .sync .row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .sync input{flex:1; min-width:180px; font:inherit; font-size:13px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 11px}
  .sync input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .btn{font:inherit; font-size:13px; font-weight:700; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); border-radius:8px; padding:8px 15px; cursor:pointer}
  .btn:hover{border-color:var(--sub)}
  .btn.pri{background:var(--accent); border-color:var(--accent); color:var(--bg)}
  .btn[disabled]{opacity:.5; cursor:default}
  .note{margin-top:12px; padding:10px 13px; border-radius:8px; font-size:12px; line-height:1.7;
    background:var(--bg); border-left:3px solid var(--accent); color:var(--sub)}
  .note b{color:var(--ink)}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); font-size:13px; padding:10px 18px; border-radius:999px;
    box-shadow:var(--shadow); z-index:9; max-width:calc(100vw - 32px)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">系統技術處 安規</div>
    <h1>安規工具</h1>
    <p class="lede">認證效期、報價試算與前置作業準備。資料存在這台裝置上，不經過任何第三方伺服器。</p>
  </header>

  <nav class="tools">
    <a class="tool" href="./expiry-board.html">
      <h2>認證效期看板</h2>
      <p>系統／Adapter／電池三類證書的到期日與剩餘天數，依到期日排序。</p>
    </a>

    <a class="tool" href="./quote.html">
      <h2>報價試算器</h2>
      <p>安規認證費用、樣品需求、文件需求與時程試算。</p>
    </a>

    <a class="tool" href="./prep.html">
      <h2>認證作業注意事項</h2>
      <p>送測前置作業的準備清單與 SOP。</p>
    </a>
  </nav>

  <section class="sync" id="sync"></section>

  <footer>
    <b>第一階段（架構驗證）</b>：目前只有效期看板，資料是跑 <code>update-cert-board.ps1</code> 產生的快照。<br>
    <b>第二階段（跨裝置同步）已接上</b>：資料存在你自己 GitHub 帳號的私密 Gist，AES-GCM 加密，金鑰由同步密語衍生。<b>沒有金鑰絕不上傳。</b>
  </footer>
</div>

<script src="./sync.js"></script>
<script src="./store.js"></script>
<script>
(() => {
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  /* 三支工具都把資料寫進共用快照 sq.data.v1（見 store.js），首頁同步的就是
     那一份 —— 所以報價存檔、準備頁存檔、效期看板、牌價會一起跨裝置。 */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const COUNT_LABEL = { quotes: '報價存檔', preps: '準備頁存檔', certs: '效期資料', config: '參考資料' };
  const counts = () => SQStore.COLS
    .map(c => COUNT_LABEL[c] + ' ' + SQStore.all(c).length)
    .join('　·　');

  function toast(msg) {
    if (!msg) return;
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg; document.body.appendChild(el);
    setTimeout(() => el.remove(), 3600);
  }

  SQSync.init({
    cols: SQStore.COLS,
    readLocal: SQStore.read,
    writeLocal: d => { SQStore.write(d); },
    onChange: () => paint(),
    onPair: code => { const i = document.getElementById('in'); if (i) { i.value = code; toast('已帶入配對碼，請按「連線」'); } },
    toast
  });

  function paint() {
    const box = document.getElementById('sync');
    const st = SQSync.status(), info = SQSync.info();
    const H = [`<div class="sync-h"><h2>跨裝置同步</h2><span class="dot ${st.cls}">${esc(st.txt)}</span></div>`];

    if (!SQSync.connected()) {
      H.push(`<p>資料存在<b>你自己 GitHub 帳號的私密 Gist</b>，不經過第三方伺服器。
        第一次要建立一把只勾 <code>gist</code> 權限的金鑰。</p>`);
      H.push(`<div class="row">
        <input id="in" type="password" placeholder="貼上 ghp_ 金鑰，或 ${SQSync.PAIR_TAG} 配對碼" autocomplete="off">
      </div><div class="row">
        <input id="pw" type="password" placeholder="同步密語（這份資料的加密金鑰）" autocomplete="off">
        <button class="btn pri" id="go">連線</button>
        <a class="btn" href="${SQSync.TOKEN_URL}" target="_blank" rel="noopener">建立金鑰</a>
      </div>`);
      H.push(`<div class="note"><b>同步密語請自己記住，沒有地方可以找回。</b>
        它是 AES-GCM 的金鑰來源 —— secret Gist 知道網址就讀得到，所以牌價與報價履歷一律加密後才上傳。
        忘記密語等於雲端那份永遠解不開（本機這份還在）。</div>`);
    } else if (SQSync.needsPassphrase()) {
      H.push(`<p>這台已連上 <b>${esc(info.login)}</b>，但雲端資料是用<b>另一組密語</b>加密的。
        輸入同一組密語，這台才會開始同步。</p>`);
      H.push(`<div class="row">
        <input id="pw2" type="password" placeholder="同步密語" autocomplete="off">
        <button class="btn pri" id="setpw">確定</button></div>`);
    } else {
      H.push(`<p>已連線到 <b>${esc(info.login)}</b> 的 GitHub${info.encrypted ? '，資料<b>已加密</b>' : ''}。
        ${info.lastSync ? '最後同步 ' + esc(info.lastSync.slice(0, 16).replace('T', ' ')) : ''}</p>`);
      H.push(`<div class="row">
        <button class="btn pri" id="now">立即同步</button>
        <button class="btn" id="pair">顯示配對碼</button>
        <button class="btn" id="off">中斷</button></div>`);
      H.push(`<div class="note">這台目前有：${esc(counts())}</div>`);
    }
    box.innerHTML = H.join('');
  }

  document.addEventListener('click', async e => {
    const id = e.target.id;
    if (id === 'go') {
      const tok = document.getElementById('in').value.trim();
      const pw  = document.getElementById('pw').value;
      if (!tok) return toast('請先貼上金鑰或配對碼');
      if (!tok.startsWith(SQSync.PAIR_TAG) && !pw) return toast('請設定同步密語 —— 沒有密語不會上傳任何資料');
      e.target.disabled = true; e.target.textContent = '連線中…';
      try { const r = await SQSync.connect(tok, pw);
            toast(r.created ? `已在 ${r.login} 建立同步空間` : `已連線到 ${r.login}`); }
      catch (err) { toast(err.status === 401 ? '金鑰無效或已過期'
                        : err.status === 403 ? '金鑰權限不足：建立時要勾選 gist'
                        : err.message || '連線失敗'); paint(); }
    }
    if (id === 'setpw') {
      const pw = document.getElementById('pw2').value;
      if (!pw) return toast('請輸入密語');
      try { await SQSync.setPassphrase(pw); } catch (err) { toast('密語不正確'); }
    }
    if (id === 'now')  SQSync.now(true);
    if (id === 'off')  { if (confirm('中斷這台裝置的同步？資料仍保留在這台與雲端。')) SQSync.disconnect(); }
    if (id === 'pair') { const c = SQSync.pairCode();
      try { await navigator.clipboard.writeText(c); toast('配對碼已複製，到另一台貼上'); }
      catch (err) { prompt('複製這段配對碼，到另一台貼上：', c); } }
  });
})();
</script>
</body>
</html>
